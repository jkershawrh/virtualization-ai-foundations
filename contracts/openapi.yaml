openapi: 3.1.0
info:
  title: Virtualization + AI evidence adapter
  version: 1.0.0
  description: >-
    Namespace-local API for a VM-originated, advisory-only analysis request and
    its redacted evidence. Credentials and raw provider responses are excluded.
paths:
  /healthz:
    get:
      operationId: health
      responses:
        "200":
          description: Adapter health and non-secret mode information
          content:
            application/json:
              schema:
                type: object
                required: [status, adapter, version, mode]
                properties:
                  status: { const: ok }
                  adapter: { const: ai-analysis-adapter }
                  version: { type: string }
                  mode: { enum: [live, rehearsal, offline] }
  /api/v1/analyze:
    post:
      operationId: analyze
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./analysis-request.schema.json
      responses:
        "200":
          description: Schema-valid advisory result or controlled unavailable condition
          content:
            application/json:
              schema:
                $ref: ./analysis-response.schema.json
        "400":
          description: Invalid request contract
        "502":
          description: Live model failed or returned invalid output
        "503":
          description: Live model configuration is unavailable
  /api/v1/evidence/{request_id}:
    get:
      operationId: evidence
      parameters:
        - in: path
          name: request_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Redacted evidence record
          content:
            application/json:
              schema:
                $ref: ./evidence-record.schema.json
        "404":
          description: Evidence record not found
