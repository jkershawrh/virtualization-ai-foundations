{{- if .Values.vm.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.vm.name }}-cloudinit
  labels:
    {{- include "virtualization-ai.labels" . | nindent 4 }}
type: Opaque
stringData:
  userdata: |
    #cloud-config
    hostname: {{ .Values.vm.name }}
    users:
      - name: lab
        lock_passwd: true
        shell: /bin/bash
        sudo: ALL=(ALL) NOPASSWD:ALL
        {{- if .Values.vm.sshAuthorizedKey }}
        ssh_authorized_keys:
          - {{ .Values.vm.sshAuthorizedKey | quote }}
        {{- end }}
    write_files:
      - path: /opt/virtualization-ai/operations-note.txt
        permissions: "0644"
        content: |
          Operator note: intermittent vibration appears after restart and clears when load is reduced; inspect before the next production window.
      - path: /usr/local/bin/virtualization-ai-client
        permissions: "0755"
        content: |
          {{- .Files.Get "files/vm_client.py" | nindent 10 }}
    runcmd:
      - ["restorecon", "-v", "/usr/local/bin/virtualization-ai-client"]
      - ["mkdir", "-p", "/var/lib/virtualization-ai"]
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: {{ .Values.vm.name }}
  labels:
    {{- include "virtualization-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: operations-vm
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        {{- include "virtualization-ai.labels" . | nindent 8 }}
        app.kubernetes.io/component: operations-vm
        vm.kubevirt.io/name: {{ .Values.vm.name }}
    spec:
      domain:
        cpu:
          cores: {{ .Values.vm.cpuCores }}
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinit
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
        resources:
          requests:
            memory: {{ .Values.vm.memory }}
          limits:
            memory: {{ .Values.vm.memory }}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          containerDisk:
            image: {{ include "virtualization-ai.image" (list .Values.vm.containerDisk) | quote }}
        - name: cloudinit
          cloudInitNoCloud:
            userDataSecretRef:
              name: {{ .Values.vm.name }}-cloudinit
{{- end }}
