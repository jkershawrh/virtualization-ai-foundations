apiVersion: apps/v1
kind: Deployment
metadata:
  name: virtualization-ai-presentation
  labels:
    {{- include "virtualization-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: presentation
spec:
  replicas: {{ .Values.presentation.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: presentation
  template:
    metadata:
      labels:
        {{- include "virtualization-ai.labels" . | nindent 8 }}
        app.kubernetes.io/component: presentation
    spec:
      serviceAccountName: virtualization-ai-presentation
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: presentation
          image: {{ default (include "virtualization-ai.image" (list .Values.presentation.image)) .Values.presentation_image | quote }}
          imagePullPolicy: {{ .Values.presentation.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.presentation.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: virtualization-ai-presentation
  labels:
    {{- include "virtualization-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: presentation
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: presentation
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- if .Values.presentation.route.enabled }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  # Keep the Route name short because OpenShift's generated host prepends it
  # to the per-seat namespace and limits that DNS label to 63 characters.
  name: lab
  labels:
    {{- include "virtualization-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: presentation
spec:
  {{- if .Values.presentation.route.host }}
  host: {{ .Values.presentation.route.host | quote }}
  {{- end }}
  to:
    kind: Service
    name: virtualization-ai-presentation
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
